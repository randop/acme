name = "luadns"
base_url = "https://api.luadns.com/v1"
allowed_hosts = ["api.luadns.com"]
token_env = "ACME_DNS_LUA_KEY"
auth_type = "header"
auth_header = "Authorization"
zone_lookup_path = "/zones"
zone_id_path = "id"
zone_records_path = ""
zone_name_path = "name"
add_path = "/zones/{{zone_id}}/records"
add_body = "{\"type\":\"TXT\",\"name\":\"{{fulldomain}}.\",\"content\":\"{{txt_value}}\",\"ttl\":120}"
record_id_path = "id"
find_path = "/zones/{{zone_id}}/records"
find_records_path = ""
find_id_path = "id"
find_name_path = "name"
find_type_path = "type"
find_value_path = "content"
find_relative_name = false
remove_path = "/zones/{{zone_id}}/records/{{record_id}}"
