name = "linode"
base_url = "https://api.linode.com/v4"
allowed_hosts = ["api.linode.com"]
token_env = "ACME_DNS_LINODE_API_KEY"
auth_type = "bearer"
zone_lookup_path = "/domains?page_size=500"
zone_id_path = "id"
zone_records_path = "data"
zone_name_path = "domain"
add_path = "/domains/{{zone_id}}/records"
add_body = "{\"type\":\"TXT\",\"name\":\"{{record_name}}\",\"target\":\"{{txt_value}}\",\"ttl_sec\":300}"
record_id_path = "id"
find_path = "/domains/{{zone_id}}/records?page_size=500"
find_records_path = "data"
find_id_path = "id"
find_name_path = "name"
find_type_path = "type"
find_value_path = "target"
find_relative_name = true
remove_path = "/domains/{{zone_id}}/records/{{record_id}}"
