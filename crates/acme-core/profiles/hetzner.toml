name = "hetzner"
base_url = "https://dns.hetzner.com/api/v1"
allowed_hosts = ["dns.hetzner.com"]
token_env = "ACME_DNS_HETZNER_TOKEN"
auth_type = "header"
auth_header = "Auth-API-Token"
zone_lookup_path = "/zones?name={{candidate_zone}}"
zone_id_path = "id"
zone_records_path = "zones"
zone_name_path = "name"
add_path = "/records"
add_body = "{\"zone_id\":\"{{zone_id}}\",\"name\":\"{{record_name}}\",\"type\":\"TXT\",\"value\":\"{{txt_value}}\",\"ttl\":120}"
record_id_path = "record.id"
find_path = "/records?zone_id={{zone_id}}&per_page=100"
find_records_path = "records"
find_id_path = "id"
find_name_path = "name"
find_type_path = "type"
find_value_path = "value"
find_relative_name = true
remove_path = "/records/{{record_id}}"
